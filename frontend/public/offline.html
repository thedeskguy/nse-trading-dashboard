<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>TradeDash — Offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(120% 120% at 50% 0%, #0b1220 0%, #000 60%);
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .card { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
      h1 { font-size: 20px; margin: 0 0 8px; font-weight: 700; }
      p { font-size: 14px; line-height: 1.5; color: #94a3b8; margin: 0 0 24px; }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: #2563eb;
        min-height: 44px;
        cursor: pointer;
      }
      button:active { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="TradeDash" />
      <h1>You're offline</h1>
      <p>TradeDash needs a connection for live market data. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
